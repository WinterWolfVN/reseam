name: ci

on:
  workflow_dispatch: 
    inputs:
      version:
        description: "Releases version:"
        required: true
        type: string
  
concurrency:
  group: ci

jobs:
  ci:
    if: ${{ !github.event.deleted }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/reseam/ci:2026.11.19
      volumes:
        - reseam-ci:/cache
    env:
      CARGO_TARGET_DIR: /cache/target
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}     
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        if: ${{ !vars.RUNNER }}
        with:
          path: |
            /cache/cargo/registry
            /cache/cargo/git
            /cache/gradle/caches
            /cache/gradle/wrapper
            /cache/bun
            /cache/npm
          key: deps-${{ hashFiles('**/Cargo.lock', '**/*.gradle.kts', '**/libs.versions.toml', '**/bun.lock', '**/package-lock.json') }}
          restore-keys: deps-

      - name: Patch mallopt and getParameterCount
        run: |
                find . -name "*.rs" -exec sed -i 's/mallopt(M_PURGE, 0);/let _ = M_PURGE;/g' {} +
                find . -name "*.rs" -exec sed -z -i -E 's/env\s*\.call_method\(member,\s*jni_str!\("getParameterCount"\),\s*jni_sig!\("\(\)I"\),\s*&\[\]\)/{\n            let pts = env.call_method(member, jni_str!("getParameterTypes"), jni_sig!("()[Ljava\/lang\/Class;"), \&[]).and_then(JValueOwned::l)?;\n            env.call_static_method(jni_str!("java\/lang\/reflect\/Array"), jni_str!("getLength"), jni_sig!("(Ljava\/lang\/Object;)I"), \&[(\&pts).into()])\n        }/g' {} +
                cargo fmt
                
      - run: just check

      - run: just release ${{ inputs.version }}

      - name: Collect SO files from Cargo cache
        run: |
                mkdir -p so-out
                for f in $(find /cache/target . -name "libreseam-sdk-native.so" 2>/dev/null); do
                    arch=$(basename $(dirname $(dirname "$f")))
                    mkdir -p "so-out/$arch"
                    cp -f "$f" "so-out/$arch/libreseam-sdk-native.so"
                done

      - name: Upload SO files to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
                name: Reseam-Native-SO
                path: |
                      so-out/**
                      **/*.so
