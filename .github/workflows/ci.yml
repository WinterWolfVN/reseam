name: ci

on:
  workflow_dispatch: 
    inputs:
      version:
        description: "Releases version:"
        required: true
        type: string
  
concurrency:
  group: ci

jobs:
  ci:
    if: ${{ !github.event.deleted }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/reseam/ci:2026.11.19
      volumes:
        - reseam-ci:/cache
    env:
      CARGO_TARGET_DIR: /cache/target
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}     
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        if: ${{ !vars.RUNNER }}
        with:
          path: |
            /cache/cargo/registry
            /cache/cargo/git
            /cache/gradle/caches
            /cache/gradle/wrapper
            /cache/bun
            /cache/npm
          key: deps-${{ hashFiles('**/Cargo.lock', '**/*.gradle.kts', '**/libs.versions.toml', '**/bun.lock', '**/package-lock.json') }}
          restore-keys: deps-

      - name: Patch mallopt and getParameterCount
        run: |
                find . -name "*.rs" -exec sed -i 's/mallopt(M_PURGE, 0);/let s = libc::dlsym(libc::RTLD_DEFAULT, b"mallopt\\0".as_ptr() as *const _); if !s.is_null() { let f: unsafe extern "C" fn(libc::c_int, libc::c_int) -> libc::c_int = std::mem::transmute(s); f(M_PURGE, 0); }/g' {} +
                find . -name "*.rs" -exec sed -z -i -E 's/env\s*\.call_method\(member,\s*jni_str!\("getParameterCount"\),\s*jni_sig!\("\(\)I"\),\s*&\[\]\)\s*\.and_then\(JValueOwned::i\)\?/{\n            let pts = env.call_method(member, jni_str!("getParameterTypes"), jni_sig!("()[Ljava\/lang\/Class;"), \&[]).and_then(JValueOwned::l)?;\n            env.get_array_length((\&pts).into())?\n        }/g' {} +

      - run: just check

      - run: just release ${{ inputs.version }}

      - name: Upload SO files to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
                name: Reseam-Native-SO
                path: |
                      **/libreseam-sdk-native.so
                      **/*.so                    
                if-no-files-found: ignore
